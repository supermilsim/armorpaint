name: Linux (Vulkan)

on:
  workflow_dispatch:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install --yes make clang libvulkan-dev libgtk-3-dev libssl-dev libxi-dev libxrandr-dev libxcursor-dev libasound2-dev
    - name: Compile
      working-directory: paint
      run: ../base/make --compile
    - name: Upload application bundle
      uses: actions/upload-artifact@v4
      with:
        name: ArmorPaint-Linux-x64
        path: paint/build/out/
        if-no-files-found: error
